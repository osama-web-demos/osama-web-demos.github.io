<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أوراليس هيلث | Demo</title><meta name="description" content="حجز موعد طبي بخطوات. نموذج تجريبي ببيانات وهمية."><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;line-height:1.65;letter-spacing:0}button,input,select{font:inherit}
.demo{position:fixed;inset-inline-start:12px;bottom:12px;z-index:9;background:#fef3c7;color:#78350f;border:1px solid #fde68a;border-radius:99px;padding:4px 14px;font-size:12.5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.back{position:fixed;inset-inline-end:12px;bottom:12px;z-index:9;background:#fff;color:#111;border:1px solid #ddd;border-radius:99px;padding:4px 14px;font-size:12.5px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-80px);background:#111;color:#fff;padding:9px 18px;border-radius:10px;transition:transform .35s cubic-bezier(.16,1,.3,1);z-index:20;font-size:14px}.toast.on{transform:translate(-50%,0)}
button:active{transform:scale(.97)}:focus-visible{outline:3px solid currentColor;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{background:#e6f5f3;color:#163b46;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
header{padding:28px 20px;display:flex;gap:14px;align-items:center;max-width:960px;margin:auto}header svg{width:52px;height:52px}header h1{margin:0;font-size:clamp(24px,5vw,36px)}header p{margin:0;color:#3d6a73}
.wrap{max-width:960px;margin:auto;padding:0 16px 100px;display:grid;grid-template-columns:1fr 1.3fr;gap:16px}@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 24px #087e7518}.card h2{margin:0 0 10px;font-size:18px}
.sp{display:flex;flex-wrap:wrap;gap:8px}.sp button{border:1.5px solid #087e75;background:#fff;color:#087e75;border-radius:99px;padding:5px 14px;cursor:pointer}.sp button.on{background:#087e75;color:#fff}
.dr{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;border:1px solid #087e7533;margin-top:8px;cursor:pointer}.dr.on{background:#e6f5f3;border-color:#087e75}.dr i{width:40px;height:40px;border-radius:50%;background:#087e75;color:#fff;display:grid;place-items:center;font-style:normal}
.sl{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}.sl button{padding:8px;border-radius:12px;border:1.5px solid #087e7555;background:#fff;cursor:pointer;font-variant-numeric:tabular-nums}.sl button.on{background:#087e75;color:#fff}.sl button:disabled{background:#eef2f2;color:#9ab;text-decoration:line-through;cursor:not-allowed}
.ok{margin-top:14px;padding:12px;background:#163b46;color:#e6f5f3;border-radius:14px;display:none}.ok.on{display:block}.go{margin-top:12px;background:#087e75;color:#fff;border:0;border-radius:99px;padding:9px 22px;cursor:pointer;font-weight:700}</style></head><body><header><svg viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="16" fill="#087e75"/><path d="M22 12h8v10h10v8H30v10h-8V30H12v-8h10z" fill="#e6f5f3"/></svg><div><h1>أوراليس هيلث</h1><p>اختر التخصص والطبيب والموعد. نموذج حجز تجريبي.</p></div></header>
<div class="wrap"><div class="card"><h2>١. التخصص</h2><div class="sp" id="sp"></div><h2 style="margin-top:16px">٢. الطبيب</h2><div id="dr"></div></div>
<div class="card"><h2>٣. المواعيد المتاحة (غداً)</h2><div class="sl" id="sl"></div><button class="go" id="go">تأكيد الحجز (تجريبي)</button><div class="ok" id="ok" role="status"></div></div></div><div class="toast" id="toast" role="status"></div><div class="demo">Demo · بيانات وهمية</div><a class="back" href="../">← المعرض</a><script>function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2200)}
function fmt(n){return Number(n).toLocaleString("ar-EG")}
var S={"باطنة":["د. سامي نور","د. ليلى حمدي"],"أطفال":["د. هاني جابر"],"جلدية":["د. مروة سعيد","د. وليد فتحي"],"أسنان":["د. رنا عادل"]},sp="",dr="",sl="",B=JSON.parse(localStorage.getItem("aur_b")||"[]");
function $(i){return document.getElementById(i)}var H=["09:00","09:30","10:00","10:30","11:00","12:00","12:30","13:00","17:00","17:30","18:00","18:30"];
function slots(){if(!dr){$("sl").innerHTML='<p>اختر الطبيب أولاً.</p>';return}$("sl").innerHTML=H.map(function(h,i){var t=(dr.length+i*3)%4==0||B.indexOf(dr+h)>-1;return'<button data-h="'+h+'" '+(t?"disabled":"")+' class="'+(sl==h?"on":"")+'">'+h+"</button>"}).join("")}
function draw(){$("sp").innerHTML=Object.keys(S).map(function(k){return'<button data-s="'+k+'" class="'+(sp==k?"on":"")+'">'+k+"</button>"}).join("");$("dr").innerHTML=sp?S[sp].map(function(d){return'<div class="dr'+(dr==d?" on":"")+'" data-d="'+d+'"><i>'+d[3]+"</i><div><b>"+d+"</b><br><small>"+sp+"</small></div></div>"}).join(""):"<p>اختر التخصص أولاً.</p>";slots()}
document.addEventListener("click",function(e){var t=e.target.closest("[data-s],[data-d],[data-h]");if(!t)return;var d=t.dataset;if(d.s){sp=d.s;dr="";sl=""}if(d.d){dr=d.d;sl=""}if(d.h)sl=d.h;draw()});
$("go").onclick=function(){if(!sl)return toast("اختر موعداً أولاً");B.push(dr+sl);localStorage.setItem("aur_b",JSON.stringify(B));$("ok").className="ok on";$("ok").textContent="تم حجز موعد تجريبي مع "+dr+" غداً الساعة "+sl+". لم يُرسل أي إشعار حقيقي.";sl="";draw();toast("تم الحجز (تجريبي)")};draw()</script></body></html>
