<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شيفت جاردن | Demo</title><meta name="description" content="جدول حضور أسبوعي تفاعلي. نموذج تجريبي ببيانات وهمية."><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;line-height:1.65;letter-spacing:0}button,input,select{font:inherit}
.demo{position:fixed;inset-inline-start:12px;bottom:12px;z-index:9;background:#fef3c7;color:#78350f;border:1px solid #fde68a;border-radius:99px;padding:4px 14px;font-size:12.5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.back{position:fixed;inset-inline-end:12px;bottom:12px;z-index:9;background:#fff;color:#111;border:1px solid #ddd;border-radius:99px;padding:4px 14px;font-size:12.5px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-80px);background:#111;color:#fff;padding:9px 18px;border-radius:10px;transition:transform .35s cubic-bezier(.16,1,.3,1);z-index:20;font-size:14px}.toast.on{transform:translate(-50%,0)}
button:active{transform:scale(.97)}:focus-visible{outline:3px solid currentColor;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{background:#f7f7f0;color:#24352b;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
header{background:#24352b;color:#f7f7f0;padding:30px 20px;border-radius:0 0 40px 40px}header div{max-width:960px;margin:auto;display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:12px}header h1{margin:0;font-size:clamp(26px,5vw,40px)}header h1 span{color:#c6f36b}
.btn{background:#c6f36b;color:#24352b;border:0;border-radius:99px;padding:9px 20px;font-weight:700;cursor:pointer}
main{max-width:960px;margin:20px auto 90px;padding:0 16px}.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}.sum div{background:#fff;border-radius:20px;padding:12px 16px;border:1px solid #24352b18}.sum b{display:block;font-size:28px;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;background:#fff;border-radius:22px;padding:10px;border:1px solid #24352b18}table{border-collapse:separate;border-spacing:5px;width:100%;min-width:560px}th{font-size:13px;color:#5b6f62;font-weight:600}td.n{font-weight:600;white-space:nowrap}
td button{width:100%;min-height:40px;border:0;border-radius:12px;cursor:pointer;font-weight:700;transition:background .2s,transform .15s}
.p{background:#c6f36b;color:#24352b}.l{background:#fde68a;color:#78350f}.a{background:#fecaca;color:#7f1d1d}.v{background:#bfdbfe;color:#1e3a8a}.e{background:#eef0ea;color:#8a978e}
.lg{margin-top:12px;font-size:13px;color:#5b6f62;display:flex;gap:12px;flex-wrap:wrap}</style></head><body><header><div><h1>شيفت <span>جاردن</span></h1><button class="btn" id="ex">تصدير CSV</button></div></header>
<main><div class="sum" id="sum"></div><div class="tw"><table id="t"></table></div><p class="lg">اضغط على الخانة لتغيير الحالة: حاضر ← متأخر ← غائب ← إجازة ← فارغ. تُحفظ على هذا المتصفح فقط، والموظفون والأسماء وهمية.</p></main><div class="toast" id="toast" role="status"></div><div class="demo">Demo · بيانات وهمية</div><a class="back" href="../">← المعرض</a><script>function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2200)}
function fmt(n){return Number(n).toLocaleString("ar-EG")}
var E=["هبة سمير","كريم نبيل","منى فاروق","طارق حسن","سلمى عادل"],Dy=["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"],K=["","p","l","a","v"],N=["—","حاضر","متأخر","غائب","إجازة"];
var M=JSON.parse(localStorage.getItem("shift")||"null")||E.map(function(_,i){return Dy.map(function(_,j){return (i*3+j*2)%7==0?3:(i+j)%5==0?2:1})});
function $(i){return document.getElementById(i)}
function draw(){$("t").innerHTML="<tr><th></th>"+Dy.map(function(d){return"<th>"+d+"</th>"}).join("")+"</tr>"+E.map(function(n,i){return'<tr><td class="n">'+n+"</td>"+M[i].map(function(v,j){return'<td><button class="'+(K[v]||"e")+'" data-i="'+i+'" data-j="'+j+'">'+N[v]+"</button></td>"}).join("")+"</tr>"}).join("");
var c=[0,0,0,0,0];M.forEach(function(r){r.forEach(function(v){c[v]++})});var tot=c[1]+c[2]+c[3];$("sum").innerHTML=[["حاضر",c[1]],["متأخر",c[2]],["غائب",c[3]],["إجازة",c[4]],["نسبة الانضباط",tot?Math.round(c[1]/tot*100)+"%":"—"]].map(function(x){return"<div><span>"+x[0]+"</span><b>"+x[1]+"</b></div>"}).join("");localStorage.setItem("shift",JSON.stringify(M))}
$("t").onclick=function(e){var b=e.target.closest("button");if(!b)return;var i=b.dataset.i,j=b.dataset.j;M[i][j]=(M[i][j]+1)%5;draw()};
$("ex").onclick=function(){var s="الموظف,"+Dy.join(",")+"\n"+E.map(function(n,i){return n+","+M[i].map(function(v){return N[v]}).join(",")}).join("\n");var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+s],{type:"text/csv"}));a.download="attendance-demo.csv";a.click();toast("تم تنزيل ملف CSV تجريبي")};draw()</script></body></html>
