<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ذا بريف | Demo</title><meta name="description" content="فهرس بنود عقود تعليمي قابل للبحث. نموذج تجريبي ببيانات وهمية."><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;line-height:1.65;letter-spacing:0}button,input,select{font:inherit}
.demo{position:fixed;inset-inline-start:12px;bottom:12px;z-index:9;background:#fef3c7;color:#78350f;border:1px solid #fde68a;border-radius:99px;padding:4px 14px;font-size:12.5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.back{position:fixed;inset-inline-end:12px;bottom:12px;z-index:9;background:#fff;color:#111;border:1px solid #ddd;border-radius:99px;padding:4px 14px;font-size:12.5px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-80px);background:#111;color:#fff;padding:9px 18px;border-radius:10px;transition:transform .35s cubic-bezier(.16,1,.3,1);z-index:20;font-size:14px}.toast.on{transform:translate(-50%,0)}
button:active{transform:scale(.97)}:focus-visible{outline:3px solid currentColor;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{background:#f1ebdd;color:#242424;font-family:Georgia,"Times New Roman",serif}
header{max-width:820px;margin:auto;padding:44px 20px 10px;border-bottom:3px double #713b2d}header h1{margin:0;font-size:clamp(30px,6vw,52px);font-weight:400;color:#713b2d}header p{margin:6px 0 14px;font-family:"Segoe UI",Tahoma,sans-serif;color:#5a5448}
main{max-width:820px;margin:auto;padding:18px 20px 90px;font-family:"Segoe UI",Tahoma,sans-serif}.s{width:100%;padding:12px 14px;border:1px solid #713b2d66;background:#fffdf7;font-size:16px}.cnt{color:#5a5448;font-size:13px;margin:8px 0 14px}
.f{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.f button{border:1px solid #713b2d66;background:none;padding:3px 14px;cursor:pointer;color:#713b2d}.f button.on{background:#713b2d;color:#fffdf7}
.c{background:#fffdf7;border:1px solid #713b2d33;border-inline-start:5px solid #713b2d;padding:14px 16px;margin-bottom:12px}.c h3{margin:0;font-family:Georgia,serif;font-weight:400;font-size:20px;cursor:pointer}.c h3:before{content:"§ ";color:#713b2d}.c .t{font-size:12px;color:#713b2d;text-transform:uppercase}
.c .d{display:none;margin-top:8px;line-height:1.9}.c.o .d{display:block}.cp{margin-top:8px;border:1px solid #713b2d66;background:none;padding:3px 12px;cursor:pointer;color:#713b2d}mark{background:#f3d98b}</style></head><body><header><h1>ذا بريف</h1><p>فهرس بنود عقود نموذجية (صياغة تعليمية مختصرة وليست استشارة قانونية). ابحث وافتح البند وانسخه.</p></header>
<main><input class="s" id="q" placeholder="ابحث: سرية، مدة، دفع..." aria-label="بحث"><div class="cnt" id="n"></div><div class="f" id="f"></div><div id="l"></div></main><div class="toast" id="toast" role="status"></div><div class="demo">Demo · بيانات وهمية</div><a class="back" href="../">← المعرض</a><script>function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2200)}
function fmt(n){return Number(n).toLocaleString("ar-EG")}
var C=[["بند السرية","عام","يلتزم كل طرف بعدم إفشاء المعلومات غير العامة التي يطّلع عليها بسبب هذا الاتفاق إلى أي جهة ثالثة، وتستمر هذه الالتزامات بعد انتهاء الاتفاق للمدة المتفق عليها."],["مدة الاتفاق","عام","يبدأ الاتفاق من تاريخ التوقيع ويستمر للمدة المحددة في الجدول، ويجدد تلقائياً ما لم يُخطر أحد الطرفين الآخر كتابةً قبل المدة المحددة."],["الدفع والفواتير","مالي","تُسدد المبالغ المستحقة خلال المدة المحددة من تاريخ استلام الفاتورة، ويجوز الاتفاق على غرامة تأخير بنسبة معلنة مسبقاً."],["التعديل","عام","لا يعتد بأي تعديل على هذا الاتفاق إلا إذا كان مكتوباً وموقعاً من الطرفين."],["إنهاء الاتفاق","إنهاء","يجوز لأي طرف إنهاء الاتفاق بإخطار كتابي مسبق، ويحق للطرف الآخر مستحقاته عن الأعمال المنفذة حتى تاريخ الإنهاء."],["الملكية الفكرية","ملكية","تنتقل ملكية المخرجات النهائية إلى العميل بعد سداد كامل المستحقات، ويحتفظ مقدم الخدمة بحقه في أدواته العامة."],["القانون الواجب التطبيق","إنهاء","يخضع الاتفاق للقانون المتفق عليه، وتُحال النزاعات إلى الجهة المختصة المحددة في الاتفاق."]];
function $(i){return document.getElementById(i)}var cat="",cats=["الكل"].concat(C.map(function(c){return c[1]}).filter(function(v,i,a){return a.indexOf(v)==i}));
$("f").innerHTML=cats.map(function(c,i){return'<button class="'+(i?"":"on")+'" data-c="'+(i?c:"")+'">'+c+"</button>"}).join("");
function hl(t,q){return q?t.split(q).join("<mark>"+q+"</mark>"):t}
function draw(){var q=$("q").value.trim(),L=C.filter(function(c){return(!cat||c[1]==cat)&&(!q||(c[0]+c[2]).indexOf(q)>-1)});$("n").textContent="عرض "+L.length+" من "+C.length+" بنوداً";$("l").innerHTML=L.map(function(c,i){return'<div class="c'+(q?" o":"")+'"><span class="t">'+c[1]+"</span><h3 tabindex=0>"+hl(c[0],q)+'</h3><div class="d">'+hl(c[2],q)+'<br><button class="cp" data-i="'+C.indexOf(c)+'">نسخ البند</button></div></div>'}).join("")}
$("q").oninput=draw;$("f").onclick=function(e){if(e.target.tagName!="BUTTON")return;cat=e.target.dataset.c;[].forEach.call($("f").children,function(b){b.classList.toggle("on",b==e.target)});draw()};
$("l").onclick=function(e){var h=e.target.closest("h3"),b=e.target.closest(".cp");if(h)h.parentNode.classList.toggle("o");if(b){var t=C[b.dataset.i][0]+": "+C[b.dataset.i][2];(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast("تم النسخ")},function(){toast("تعذّر النسخ تلقائياً")})}};
$("l").onkeydown=function(e){if(e.key=="Enter"&&e.target.tagName=="H3")e.target.parentNode.classList.toggle("o")};draw()</script></body></html>
