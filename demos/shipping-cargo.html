<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كارجو سيجنال | Demo</title><meta name="description" content="محاكاة تتبع شحنة. نموذج تجريبي ببيانات وهمية."><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;line-height:1.65;letter-spacing:0}button,input,select{font:inherit}
.demo{position:fixed;inset-inline-start:12px;bottom:12px;z-index:9;background:#fef3c7;color:#78350f;border:1px solid #fde68a;border-radius:99px;padding:4px 14px;font-size:12.5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.back{position:fixed;inset-inline-end:12px;bottom:12px;z-index:9;background:#fff;color:#111;border:1px solid #ddd;border-radius:99px;padding:4px 14px;font-size:12.5px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-80px);background:#111;color:#fff;padding:9px 18px;border-radius:10px;transition:transform .35s cubic-bezier(.16,1,.3,1);z-index:20;font-size:14px}.toast.on{transform:translate(-50%,0)}
button:active{transform:scale(.97)}:focus-visible{outline:3px solid currentColor;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{background:#eaf0f5;color:#102c4a;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
header{background:#102c4a;color:#fff;padding:34px 20px 70px}header div{max-width:900px;margin:auto}header h1{margin:0;font-size:clamp(26px,5vw,44px)}header h1 span{color:#5eead4}header p{opacity:.8;margin:4px 0 0}
.box{max-width:900px;margin:-44px auto 0;padding:0 16px 90px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 10px 30px #102c4a22;margin-bottom:16px}
.sr{display:flex;gap:8px;flex-wrap:wrap}.sr input{flex:1;min-width:180px;padding:11px;border:2px solid #102c4a33;border-radius:10px;font-family:Consolas,monospace;font-size:16px;direction:ltr;text-align:left}.sr button{background:#102c4a;color:#5eead4;border:0;border-radius:10px;padding:0 22px;cursor:pointer;font-weight:700}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.chips button{background:#eaf0f5;border:1px solid #102c4a22;border-radius:99px;padding:3px 12px;font-family:Consolas,monospace;cursor:pointer;direction:ltr}
.steps{display:flex;margin:22px 0 8px;position:relative}.st{flex:1;text-align:center;position:relative;font-size:13px}.st i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;margin:0 auto 6px;background:#d5dee8;color:#5b7088;font-style:normal;position:relative;z-index:1;transition:all .4s}.st.on i{background:#5eead4;color:#102c4a;font-weight:700}.st.cur i{box-shadow:0 0 0 6px #5eead455}
.st:not(:last-child):after{content:"";position:absolute;top:14px;inset-inline-end:-50%;width:100%;height:3px;background:#d5dee8}.st.on:not(:last-child):after{background:#5eead4}
.log{font-family:Consolas,monospace;font-size:13px;direction:ltr;text-align:left;background:#102c4a;color:#5eead4;border-radius:10px;padding:12px;min-height:90px}.sim{font-size:12px;background:#fef3c7;color:#78350f;padding:2px 10px;border-radius:99px}</style></head><body><header><div><h1>كارجو <span>سيجنال</span></h1><p>تتبع شحنة تجريبية عبر مراحلها. المحاكاة لا ترتبط بأي شركة شحن حقيقية.</p></div></header>
<div class="box"><div class="card"><div class="sr"><input id="c" value="CS-48210" aria-label="رقم الشحنة"><button id="go">تتبع</button></div><div class="chips"><button>CS-48210</button><button>CS-77305</button><button>CS-10092</button></div></div>
<div class="card"><span class="sim">محاكاة</span><div class="steps" id="st"></div><div class="log" id="lg">أدخل رقم شحنة تجريبي.</div></div></div><div class="toast" id="toast" role="status"></div><div class="demo">Demo · بيانات وهمية</div><a class="back" href="../">← المعرض</a><script>function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2200)}
function fmt(n){return Number(n).toLocaleString("ar-EG")}
var ST=["استلام","فرز","في الطريق","وصلت للمدينة","تم التسليم"];var SH={"CS-48210":[5,"القاهرة → الإسكندرية"],"CS-77305":[3,"الجيزة → أسيوط"],"CS-10092":[1,"المنصورة → الأقصر"]};
function $(i){return document.getElementById(i)}var tm;
function run(code){clearInterval(tm);var s=SH[code.trim().toUpperCase()];if(!s){$("st").innerHTML="";$("lg").textContent="> رقم غير موجود في البيانات التجريبية";return toast("جرّب أحد الأرقام الظاهرة")}
var k=0,lg="> "+code.toUpperCase()+"  "+s[1]+"\n";function draw(){$("st").innerHTML=ST.map(function(t,i){return '<div class="st'+(i<k?" on":"")+(i==k-1?" cur":"")+'"><i>'+(i<k?"✓":i+1)+"</i>"+t+"</div>"}).join("");$("lg").innerText=lg}
draw();tm=setInterval(function(){if(k>=s[0]){clearInterval(tm);lg+="> (محاكاة) انتهى العرض";return draw()}lg+="> "+ST[k]+" ✓\n";k++;draw()},700)}
$("go").onclick=function(){run($("c").value)};document.querySelector(".chips").onclick=function(e){if(e.target.tagName=="BUTTON"){$("c").value=e.target.textContent;run(e.target.textContent)}};run("CS-48210")</script></body></html>
