<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أكاديمية فورما | Demo</title><meta name="description" content="مسار تعلم تفاعلي بدروس تُفتح تباعاً. نموذج تجريبي ببيانات وهمية."><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;line-height:1.65;letter-spacing:0}button,input,select{font:inherit}
.demo{position:fixed;inset-inline-start:12px;bottom:12px;z-index:9;background:#fef3c7;color:#78350f;border:1px solid #fde68a;border-radius:99px;padding:4px 14px;font-size:12.5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18)}

button:active{transform:scale(.97)}:focus-visible{outline:3px solid currentColor;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{background:#fff8e8;color:#30245c;font-family:"Trebuchet MS","Segoe UI",sans-serif;background-image:linear-gradient(#30245c14 1px,transparent 1px);background-size:100% 32px}
header{max-width:820px;margin:auto;padding:36px 20px 6px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}header h1{margin:0;font-size:clamp(26px,5vw,42px)}header h1 mark{background:#fde68a;color:inherit;padding:0 8px;border-radius:8px}
.arc{width:110px;height:110px;position:relative}.arc svg{transform:rotate(-90deg)}.arc b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-variant-numeric:tabular-nums}
main{max-width:820px;margin:auto;padding:10px 16px 90px}.path{position:relative;padding-inline-start:36px}.path:before{content:"";position:absolute;inset-inline-start:15px;top:10px;bottom:10px;width:3px;background:#30245c22}
.l{position:relative;background:#fff;border:2px solid #30245c;border-radius:18px 18px 18px 4px;padding:14px 16px;margin:0 0 14px;box-shadow:4px 4px 0 #30245c;transition:transform .25s}.l:before{content:attr(data-n);position:absolute;inset-inline-start:-36px;top:14px;width:30px;height:30px;border-radius:50%;background:#30245c;color:#fff;display:grid;place-items:center;font-size:14px}
.l.done:before{content:"✓";background:#16a34a}.l.lock{opacity:.5;box-shadow:none;border-style:dashed}.l h3{margin:0 0 2px}.l p{margin:0 0 10px;color:#5b5190;font-size:14px}
.l button{background:#fde68a;border:2px solid #30245c;border-radius:10px;padding:6px 16px;cursor:pointer;font-weight:700;color:#30245c}.l button:disabled{cursor:not-allowed;background:#eee}.l.done button{background:#bbf7d0}
.q{display:none;margin-top:10px;padding:10px;background:#f5f3ff;border-radius:10px}.q.on{display:block}.q label{display:block;padding:4px 0}
.r{background:none;border:0;text-decoration:underline;cursor:pointer;color:#5b5190;margin:14px 0}</style></head><body><header><div class="arc"><svg width="110" height="110"><circle cx="55" cy="55" r="46" fill="none" stroke="#30245c22" stroke-width="10"/><circle id="ring" cx="55" cy="55" r="46" fill="none" stroke="#7c3aed" stroke-width="10" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="289" style="transition:stroke-dashoffset .6s cubic-bezier(.16,1,.3,1)"/></svg><b id="pc">0%</b></div><div><h1>أكاديمية <mark>فورما</mark></h1><div>مسار تعلّم تجريبي: أكمل الدرس لتفتح الذي يليه.</div></div></header>
<main><div class="path" id="p"></div><button class="r" id="rs">إعادة ضبط التقدم</button></main><div class="toast" id="toast" role="status"></div><div class="demo">Demo · بيانات وهمية</div><a class="back" href="../">← المعرض</a><script>function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2200)}
function fmt(n){return Number(n).toLocaleString("ar-EG")}
var L=[["أساسيات HTML","بنية الصفحة والعناوين والروابط.","ما الوسم المناسب لعنوان رئيسي؟",["h1","div","span"],0],["تنسيق CSS","الألوان والمسافات والشبكات.","أي خاصية تغيّر لون الخلفية؟",["color","background","margin"],1],["تفاعل JavaScript","الأحداث وتعديل الصفحة.","أي حدث يُستخدم عند النقر؟",["click","hover","load"],0],["نماذج وتحقق","حقول الإدخال والتحقق.","أي وسم يجمع حقول النموذج؟",["table","form","nav"],1],["مشروع مصغّر","اجمع ما تعلمته في صفحة واحدة.","هل ستضيف تسمية Demo للبيانات الوهمية؟",["نعم","لا"],0]];
var S=JSON.parse(localStorage.getItem("forma")||"0");function $(i){return document.getElementById(i)}
function draw(){$("p").innerHTML=L.map(function(l,i){var st=i<S?"done":i==S?"":"lock";return '<div class="l '+st+'" data-n="'+(i+1)+'"><h3>'+l[0]+"</h3><p>"+l[1]+"</p>"+(i==S?'<button data-s="'+i+'">ابدأ اختبار الدرس</button><div class="q" id="q'+i+'"><b>'+l[2]+"</b>"+l[3].map(function(o,k){return '<label><input type="radio" name="o'+i+'" value="'+k+'"> '+o+"</label>"}).join("")+'<button data-c="'+i+'">تحقق</button></div>':i<S?'<button disabled>مكتمل ✓</button>':'<button disabled>🔒 مقفل</button>')+"</div>"}).join("");
var pc=Math.round(S/L.length*100);$("pc").textContent=pc+"%";$("ring").style.strokeDashoffset=289*(1-pc/100)}
$("p").onclick=function(e){var s=e.target.dataset.s,c=e.target.dataset.c;if(s!=null){$("q"+s).classList.add("on");e.target.style.display="none"}if(c!=null){var r=document.querySelector("input[name=o"+c+"]:checked");if(!r)return toast("اختر إجابة أولاً");if(+r.value==L[c][4]){S=+c+1;localStorage.setItem("forma",S);toast(S==L.length?"أنهيت المسار التجريبي":"إجابة صحيحة، فُتح الدرس التالي");draw()}else toast("إجابة غير صحيحة، حاول مرة أخرى")}};
$("rs").onclick=function(){S=0;localStorage.removeItem("forma");draw();toast("أُعيد الضبط")};draw()</script></body></html>
