<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مائدة الزعفران | Demo</title><meta name="description" content="قائمة طعام مع تذكرة طلب. نموذج تجريبي ببيانات وهمية."><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;line-height:1.65;letter-spacing:0}button,input,select{font:inherit}
.demo{position:fixed;inset-inline-start:12px;bottom:12px;z-index:9;background:#fef3c7;color:#78350f;border:1px solid #fde68a;border-radius:99px;padding:4px 14px;font-size:12.5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.back{position:fixed;inset-inline-end:12px;bottom:12px;z-index:9;background:#fff;color:#111;border:1px solid #ddd;border-radius:99px;padding:4px 14px;font-size:12.5px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-80px);background:#111;color:#fff;padding:9px 18px;border-radius:10px;transition:transform .35s cubic-bezier(.16,1,.3,1);z-index:20;font-size:14px}.toast.on{transform:translate(-50%,0)}
button:active{transform:scale(.97)}:focus-visible{outline:3px solid currentColor;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{background:#fff0e5;color:#3b2a1f;font-family:Georgia,"Segoe UI",serif}
header{background:#c2410c;color:#fff0e5;padding:34px 20px 46px;text-align:center;border-radius:0 0 50% 50%/0 0 28px 28px}header h1{margin:0;font-size:clamp(30px,6vw,50px);font-weight:400}header p{margin:6px 0 0;font-family:"Segoe UI",sans-serif;opacity:.9}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:-20px 12px 14px;position:relative}.tabs button{background:#fff;border:2px solid #596b42;color:#596b42;border-radius:99px;padding:6px 16px;cursor:pointer;font-weight:700}.tabs button.on{background:#596b42;color:#fff}
.wrap{max-width:980px;margin:auto;padding:6px 14px 100px;display:grid;grid-template-columns:2fr 1fr;gap:16px}@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.m{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;font-family:"Segoe UI",sans-serif}.d{background:#fff;border-radius:26px 26px 26px 6px;padding:14px;border:1px solid #c2410c33;transition:transform .25s cubic-bezier(.16,1,.3,1)}.d:hover{transform:translateY(-3px)}.d i{display:block;height:70px;border-radius:50% 50% 40% 60%/60% 40% 60% 40%;margin-bottom:8px}.d h3{margin:0;font-family:Georgia,serif;font-weight:400}.d small{color:#596b42}.d b{display:block;margin:4px 0;font-variant-numeric:tabular-nums}.d button{background:#c2410c;color:#fff;border:0;border-radius:99px;padding:5px 14px;cursor:pointer}
.tk{background:#fff;border:2px dashed #3b2a1f;border-radius:6px;padding:16px;font-family:Consolas,monospace;align-self:start;position:sticky;top:10px}.tk h2{margin:0 0 8px;text-align:center;font-size:17px}.tk div.r{display:flex;justify-content:space-between;padding:3px 0}.tk .t{border-top:2px dashed #3b2a1f;margin-top:8px;padding-top:8px;font-weight:700}.tk button{width:100%;margin-top:10px;background:#596b42;color:#fff;border:0;padding:8px;cursor:pointer;border-radius:6px}.tk .q button{width:22px;margin:0 4px;padding:0}</style></head><body><header><h1>مائدة الزعفران</h1><p>اختر الأطباق وشاهد تذكرة الطلب والإجمالي مباشرة. قائمة تجريبية.</p></header>
<div class="tabs" id="tb"></div><div class="wrap"><div class="m" id="m"></div><aside class="tk"><h2>تذكرة طلب (عينة)</h2><div id="tk"><p style="text-align:center">لا توجد أطباق بعد</p></div></aside></div><div class="toast" id="toast" role="status"></div><div class="demo">Demo · بيانات وهمية</div><a class="back" href="../">← المعرض</a><script>function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2200)}
function fmt(n){return Number(n).toLocaleString("ar-EG")}
var M=[["شوربة عدس","مقبلات",35,"#f6c177","نباتي"],["سلطة بلدي","مقبلات",30,"#9dc183","نباتي"],["محشي مشكل","رئيسي",120,"#e07a5f","شيف"],["كفتة مشوية","رئيسي",140,"#c2410c","حار"],["أرز بالخلطة","رئيسي",85,"#f2cc8f",""],["أم علي","حلوى",55,"#f4d6a0","شيف"],["كنافة بالقشطة","حلوى",60,"#e9b872",""],["عصير ليمون بالنعناع","مشروبات",30,"#b7e4a6","نباتي"]],T=["الكل","مقبلات","رئيسي","حلوى","مشروبات"],c="الكل",O={};
function $(i){return document.getElementById(i)}
$("tb").innerHTML=T.map(function(t,i){return'<button class="'+(i?"":"on")+'" data-t="'+t+'">'+t+"</button>"}).join("");
function draw(){$("m").innerHTML=M.filter(function(d){return c=="الكل"||d[1]==c}).map(function(d){var i=M.indexOf(d);return'<div class="d"><i style="background:'+d[3]+'"></i><h3>'+d[0]+"</h3><small>"+d[1]+(d[4]?" · "+d[4]:"")+"</small><b>"+fmt(d[2])+' ج</b><button data-a="'+i+'">أضف</button></div>'}).join("")}
function tk(){var k=Object.keys(O);if(!k.length){$("tk").innerHTML='<p style="text-align:center">لا توجد أطباق بعد</p>';return}var s=0,h=k.map(function(i){var q=O[i],p=M[i][2]*q;s+=p;return'<div class="r"><span>'+M[i][0]+' <span class="q"><button data-m="'+i+'">-</button>'+q+'<button data-p="'+i+'">+</button></span></span><span>'+fmt(p)+"</span></div>"}).join("");var t=Math.round(s*.14);$("tk").innerHTML=h+'<div class="r t"><span>المجموع</span><span>'+fmt(s)+'</span></div><div class="r"><span>ضريبة افتراضية 14%</span><span>'+fmt(t)+'</span></div><div class="r t"><span>الإجمالي</span><span>'+fmt(s+t)+'</span></div><button data-x="1">إرسال الطلب (تجريبي)</button>'}
document.addEventListener("click",function(e){var t=e.target,d=t.dataset;if(d.t){c=d.t;[].forEach.call($("tb").children,function(b){b.classList.toggle("on",b==t)});draw()}if(d.a){O[d.a]=(O[d.a]||0)+1;tk();toast("أُضيف: "+M[d.a][0])}if(d.p){O[d.p]++;tk()}if(d.m){if(--O[d.m]<=0)delete O[d.m];tk()}if(d.x){O={};tk();toast("تم إنشاء تذكرة تجريبية، لم يُرسل شيء")}});draw()</script></body></html>
