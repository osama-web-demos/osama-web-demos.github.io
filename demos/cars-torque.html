<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تورك ستوديو | Demo</title><meta name="description" content="مقارنة سيارات وحاسبة قسط. نموذج تجريبي ببيانات وهمية."><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;line-height:1.65;letter-spacing:0}button,input,select{font:inherit}
.demo{position:fixed;inset-inline-start:12px;bottom:12px;z-index:9;background:#fef3c7;color:#78350f;border:1px solid #fde68a;border-radius:99px;padding:4px 14px;font-size:12.5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.back{position:fixed;inset-inline-end:12px;bottom:12px;z-index:9;background:#fff;color:#111;border:1px solid #ddd;border-radius:99px;padding:4px 14px;font-size:12.5px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-80px);background:#111;color:#fff;padding:9px 18px;border-radius:10px;transition:transform .35s cubic-bezier(.16,1,.3,1);z-index:20;font-size:14px}.toast.on{transform:translate(-50%,0)}
button:active{transform:scale(.97)}:focus-visible{outline:3px solid currentColor;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{background:#17191e;color:#e8ebf0;font-family:Arial,"Segoe UI",sans-serif}
header{padding:40px 22px 20px;border-bottom:4px solid #ff6b35;max-width:1100px;margin:auto}header h1{margin:0;font-size:clamp(28px,6vw,52px);text-transform:uppercase;letter-spacing:0;font-weight:900}header h1 span{color:#ff6b35}header p{margin:6px 0 0;color:#9aa3b2}
.wrap{max-width:1100px;margin:auto;padding:18px 16px 90px;display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.wrap{grid-template-columns:1fr}}
.col{background:#20232a;border:1px solid #2d323c;clip-path:polygon(0 0,100% 0,100% 94%,94% 100%,0 100%);padding:16px}select{width:100%;padding:10px;background:#17191e;color:#fff;border:1px solid #3a4150;font-weight:700}
.car{height:130px;margin:12px 0}.car svg{width:100%;height:100%}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #2d323c;font-variant-numeric:tabular-nums}.row span{color:#9aa3b2}.row b{transition:color .3s}.row.win b{color:#ff6b35}.row.win b:before{content:"▲ "}
.calc{grid-column:1/-1;background:#ff6b35;color:#17191e;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end;font-weight:700}.calc label{font-size:13px;display:block}.calc input{width:100%;padding:8px;border:0;background:#17191e;color:#fff;font-weight:700}
.calc .o{background:#17191e;color:#ff6b35;padding:10px;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}.calc small{display:block;grid-column:1/-1;font-weight:400}</style></head><body><header><h1>تورك <span>ستوديو</span></h1><p>قارن سيارتين، وشاهد الأفضل في كل مواصفة، ثم قدّر القسط الشهري.</p></header>
<div class="wrap"><div class="col"><select id="s1" aria-label="السيارة الأولى"></select><div class="car" id="c1"></div><div id="t1"></div></div>
<div class="col"><select id="s2" aria-label="السيارة الثانية"></select><div class="car" id="c2"></div><div id="t2"></div></div>
<div class="calc"><div><label>السيارة المختارة (الأولى)</label><div class="o" id="pr"></div></div><div><label>الدفعة المقدمة %</label><input id="dp" type="number" min="0" max="80" value="20"></div><div><label>المدة (شهراً)</label><input id="mo" type="number" min="12" max="84" step="12" value="48"></div><div><label>القسط الشهري التقديري</label><div class="o" id="out"></div></div>
<small>حساب توضيحي بفائدة افتراضية 18% سنوياً على الرصيد المتناقص. لا يمثل عرض تمويل حقيقي. السيارات والأسعار وهمية.</small></div></div><div class="toast" id="toast" role="status"></div><div class="demo">Demo · بيانات وهمية</div><a class="back" href="../">← المعرض</a><script>function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2200)}
function fmt(n){return Number(n).toLocaleString("ar-EG")}
var C=[["سيدان كومباكت","1.6 L",122,11.8,4.8,3,980000],["كروس أوفر عائلي","2.0 L",156,9.6,7.9,5,1450000],["هاتشباك رياضي","1.5 T",181,8.1,6.2,4,1120000],["كهربائية حضرية","200 كم مدى",150,7.4,4.0,5,1780000]];
var R=[["القوة (حصان)",2,1],["التسارع 0-100 (ث)",3,-1],["الاستهلاك (ل/100كم)",4,-1],["الأمان (نجوم)",5,1],["السعر (جنيه)",6,-1]];
function $(i){return document.getElementById(i)}
["s1","s2"].forEach(function(i,k){$(i).innerHTML=C.map(function(c,j){return '<option value="'+j+'">'+c[0]+"</option>"}).join("");$(i).value=k?1:0;$(i).onchange=draw});
function car(i){var c=["#ff6b35","#d8dee8","#5a6272","#7dd3fc"][i];return '<svg viewBox="0 0 300 120"><path d="M20 82 L50 52 Q80 30 140 30 L200 30 Q240 36 265 62 L285 74 L285 90 L20 90Z" fill="'+c+'"/><path d="M70 54 Q95 38 140 38 L150 38 L150 62 L62 62Z M158 38 L198 38 Q222 44 240 62 L158 62Z" fill="#17191e"/><circle cx="80" cy="92" r="17" fill="#0c0d10"/><circle cx="235" cy="92" r="17" fill="#0c0d10"/><circle cx="80" cy="92" r="7" fill="#d8dee8"/><circle cx="235" cy="92" r="7" fill="#d8dee8"/></svg>'}
function draw(){var a=C[$("s1").value],b=C[$("s2").value];$("c1").innerHTML=car($("s1").value);$("c2").innerHTML=car($("s2").value);
function tbl(x,y){return '<div class="row"><span>المحرك</span><b>'+x[1]+"</b></div>"+R.map(function(r){var w=(x[r[1]]-y[r[1]])*r[2]>0;return '<div class="row'+(w?" win":"")+'"><span>'+r[0]+"</span><b>"+(r[1]==6?fmt(x[6]):x[r[1]])+"</b></div>"}).join("")}
$("t1").innerHTML=tbl(a,b);$("t2").innerHTML=tbl(b,a);calc()}
function calc(){var p=C[$("s1").value][6],d=Math.min(80,Math.max(0,+$("dp").value||0)),n=Math.max(12,+$("mo").value||48),L=p*(1-d/100),r=.18/12,m=L*r/(1-Math.pow(1+r,-n));$("pr").textContent=fmt(p)+" ج";$("out").textContent=fmt(Math.round(m))+" ج/شهر"}
$("dp").oninput=calc;$("mo").oninput=calc;draw()</script></body></html>
